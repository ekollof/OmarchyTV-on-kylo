# Supervised no-plat candidate: binds the UI to the vendor-initialized fb1.
# No platform bring-up, no watchdog change, vendor Aurora remains running.
autoload = settings,display_fb,ui_engine,ui_vendor

host.heartbeat = /tmp/oa_candidate.alive

settings.db = /conf/sqlite_db/settingsDB.db
settings.readonly = 1

display.fb = /dev/fb1

ui.dir = /buffer/oa_candidate/ui
ui.screen = apps
ui.grid_sel = 0
ui.fps = 2
ui.ok_file = /tmp/oa_candidate.ready
ui.live_cards = 1

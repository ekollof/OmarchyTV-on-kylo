# Supervised fb1 visible PNG+JPEG test. Vendor Aurora remains owner.
autoload = settings,image_decode,display_fb,ui_engine,ui_vendor

host.heartbeat = /tmp/oa_visible.alive

settings.db = /conf/sqlite_db/settingsDB.db
settings.readonly = 1

display.fb = /dev/fb1
# Do not change the vendor region; fb-restore restores pixels/yoffset.
display.set_region = 0
display.pan = 0

ui.dir = /buffer/oa_visible_20261104/ui
ui.download_dir = /buffer/downloaded_images
ui.screen = apps
ui.grid_sel = 0
ui.fps = 2
ui.ok_file = /tmp/oa_visible.ready
ui.live_cards = 1

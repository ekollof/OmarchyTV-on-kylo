# STATE:
#   $name
#     state_of_initialize    the state in the initial stage
#     state_of_switch_off    the state after switching off the application
#   $value
#     0x0                    the application is in the STOP state
#     0x1                    the application runs as BACKGROUND mode.
#     0x2                    the application runs as FOREGROUND mode.
#     0x3                    the application is in the PAUSE state
#     0x80                   the application will be in the STOP state by itself.
#
[debug]
enable_error=y
enable_warn=y
enable_info=y
enable_debug=y
enable_trace=y
#log_file=/tmp/appmgr.log

[config]
gid=0
uid=0
layer0=1280x720
layer1=1280x720
layer2=720x576
hotkey=n #y: enable, n:disable
cursor=n
cursor-cursorNormal=/mtd_apexe/board/com.nvt.appmgr/cursor_arrow_normal.png
cursor-cursorPressed=/mtd_apexe/board/com.nvt.appmgr/cursor_arrow_press.png
cursor-cursorOnClickable=/mtd_apexe/board/com.nvt.appmgr/cursor_hand_normal.png
cursor-cursorOnEditable=/mtd_apexe/board/com.nvt.appmgr/cursor_hand_over.png
cursor-time-out=5
cursor-move-event=n

debug-default-app=idtv
default-app=idtv
volume-app=idtv
source-app=idtv
presever-app=privserver
welcome=n
delay_launch=6
wait_for_idtv=y
enableMultiuser=y
logo_on_layer=y
logo-app=idtv
DFB_pre_allocate=y
handle_KB_event=n

[apps]
# the order decide the position in the application list.
privserver=y
idtv=y
dialserver=y
ntts=n
netflix=y
amazon=y
youtube=y
youtube_test=y
demo1=n
demo2=n

[hotkey]
f1=idtv
f2=netflix
f3=demo1
f4=

[dialserver]
gid=105
uid=105
index=0x02
name=dialserver
program=/mtd_apexe/board/com.nvt.dial/com.nvt.dialserver
icon=
state_of_initialize=BG
state_of_switch_off=BG
state_of_switch_on=BG
state_of_poweroff=BG
resource=
descr=dail server
#property=SUSPEND|BG|NODFB|DELAY

[idtv]
gid=101|6|7|8|200
uid=101
index=0x10
name=idtv
program=/buffer/aurora.elf
args=
state_of_initialize=FG
state_of_switch_off=PAUSE
layer=1280x720
property=VOLCTRL|NODFB|IPCKEY
caps=CAP_SYS_NICE|CAP_SYS_BOOT|CAP_WAKE_ALARM

[privserver]
gid=110|6|7|8|200
uid=110
index=0x110
name=privserver
program=/mtd_apexe/board/com.nvt.privserver/com.nvt.privserver
args=
state_of_initialize=1
state_of_switch_off=1
property=NODFB|IPCKEY
caps=CAP_NET_ADMIN|CAP_SYS_MODULE|CAP_SYS_RAWIO|CAP_SYS_ADMIN|CAP_SYS_BOOT|CAP_NET_RAW|CAP_KILL|CAP_SYS_TIME|CAP_FOWNER|CAP_NET_BIND_SERVICE

[netflix]
gid=102|200|6|8
uid=102
index=0x11
name=netflix
program=/mtd_apexe/board/com.nvt.nflx/netflix
#args=--loglevel=error --dpi-language ${BCP47} --dpi-friendlyname ${FDYNAME} --no-dpi-support-ntts --dpi-splash-rened-cnt 4 --disk-cache-write-limit 51380224 --dpi-displaypanelwidth 85 --dpi-displaypanelheight 48 --surface-cache-capacity 52428800 --disk-cache-capacity 12582912 -Q
args=--console-sink --loglevel=error --dpi-language ${BCP47} --dpi-friendlyname ${FDYNAME} ${DolbyVisionSupport} --no-dpi-support-ntts --dpi-format-notify --disk-cache-write-limit 204457166 --dpi-displaypanelwidth 94 --dpi-displaypanelheight 53 --disk-cache-capacity 31457280 -Q
extra_args_of_initialize=source_type=22&additionalDataUrl=http%3A%2F%2Flocalhost%3A56789%2Fapps%2FNetflix%2Fdial_data%3F --no-resources --resources cpu --resources network
extra_args_of_reinitialize=source_type=23&additionalDataUrl=http%3A%2F%2Flocalhost%3A56789%2Fapps%2FNetflix%2Fdial_data%3F --no-resources --resources cpu --resources network
state_of_initialize=PAUSE
state_of_switch_off=PAUSE
state_of_switch_on=FG
state_of_poweroff=STOP_BY_SELF
layer_id=2
layer=1280x720
is_wait_exit=1
script_reset=/mtd_apexe/board/com.nvt.nflx/factory_reset.sh
#resident_for_network=-600
property=RP|RE|SUSPEND|BOOT1|DELAY10|LOGO|IPCKEY
report=/tmp/netflix_report
caps=CAP_SYS_NICE

[amazon]
gid=104|200|6|8
uid=104
index=0x104
name=amazon
program=/mtd_apexe/board/com.nvt.amazon/run.sh
state_of_initialize=STOP
state_of_switch_off=STOP_BY_SELF
state_of_switch_on=FG
state_of_poweroff=STOP_BY_SELF
layer_id=1
layer=1920x1080
script_reset=/mtd_apexe/board/com.nvt.amazon/factory_reset.sh
property=IPCKEY|SUSPEND|SENDSTATE|DELAY
is_wait_exit=0

[ntts]
gid=109|200
uid=109
index=0x18
name=ntts
program=/mtd_apexe/board/com.nvt.ntts/nvttts
state_of_initialize=PAUSE
state_of_switch_off=BG
args=-p /mtd_apexe/board/com.nvt.ntts -a default -o ui_card=hw:0,0,ui_ctl=channel0_vol,media_card=default,media_ctl="main gain ratio"
#resident_for_network=-600
property=NOREG|BG|DELAY3|NODFB|DELAY

[youtube]
gid=103|200|6|8
uid=103
index=0x101
name=youtube
program=/mtd_apexe/board/com.nvt.cobalt/run.sh
args= --url=https://www.youtube.com/tv?${PARAM}
extra_args_of_initialize=launch=preload&additionalDataUrl=http%3A%2F%2Flocalhost%3A56789%2Fapps%2FYouTube%2Fdial_data%3F
state_of_initialize=STOP
state_of_switch_off=STOP_BY_SELF
state_of_switch_on=FG
state_of_poweroff=STOP_BY_SELF
layer_id=1
layer=1280x720
timeout=10000
is_wait_exit=0
resident_for_network=-600 # for suspend mode
property=IPCKEY|SENDSTATE|DELAY
repeat_magnification=4
repeatkey_delayinterval=19000 # (us) for delay repeat key

[youtube_test]
gid=103|200|6|8
uid=103
index=0x101
name=youtube_test
program=/mtd_apexe/board/com.nvt.cobalt/run.sh
extra_args_of_initialize=launch=preload&additionalDataUrl=http%3A%2F%2Flocalhost%3A56789%2Fapps%2FYouTube%2Fdial_data%3F
state_of_initialize=STOP
state_of_switch_off=STOP
state_of_switch_on=FG
state_of_poweroff=STOP
layer_id=0
layer=1280x720
timeout=10000
is_wait_exit=1
resident_for_network=-600 # for suspend mode
property=IPCKEY|SENDSTATE|CLEAROSD|DELAY
repeat_magnification=4
repeatkey_delayinterval=19000 # (us) for delay repeat key
[demo1]
index=0x80
name=demo1
program=/mtd_apexe/board/com.nvt.appmgr/com.nvt.dfb_demo1
state_of_initialize=STOP
state_of_switch_off=STOP_BY_SELF
layer=1280x720
timeout=1000
is_wait_exit=0


[demo2]
index=0x81
name=demo2
program=/mtd_apexe/board/com.nvt.appmgr/com.nvt.dfb_demo2
state_of_initialize=STOP
state_of_switch_off=STOP_BY_SELF
layer=1280x720
timeout=3000
is_wait_exit=1

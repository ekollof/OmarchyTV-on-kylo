# Data-only immutable profile facts; run from openaurora/. No drawing/device I/O.
autoload = ui_profile
ui_profile.swprofile = ../artifacts/profiles/mb230_swprofile.bin
# Native replacement can use /conf/mb230_swprofile.bin after verifying provenance.
# Reload rereads the file, not host configuration. This does not enable hotel
# mode, configure networking or provide mutable app/hotel/content state.

# Cold-start replacement candidate — stock vendor UI, real platform.
#
# NOT TV-ACCEPTED. This profile is for a boot without stock Aurora; it has no
# stock fallback and must only be used with an independent recovery path. The
# tested takeover path remains openaurora-full-replacement.conf
# (plat.drm_init=0, display.restore_snapshot=1, panel.power_on_start=0).
#
# The device-layer DEV_GPIO_Init/DEV_IIC_Init are not used: no OpenAurora
# module references a vendor DEV_* symbol. The modules use the NDAL HAL
# (Hal_Gpio_*, Hal_Iic_*, Hal_Pwm_*) or implement the device behavior
# themselves. This is the HAL-only ownership decision from
# PLATFORM-PARITY-GAP-2026-11-08.
#
# Cold flags:
#   plat.drm_init=1            run the real video/DRM bring-up
#   display.restore_snapshot=0 nothing to restore on a cold boot
#   panel.standby=1            enable the power/LVDS sequence
#   panel.power_on_start=1     run panel power-on at start
#   audio.i2s_mclk=1           DEV_AMP_Init's 0x3a/0x100 request
#   spi.enable=1               DEV_SPI_Init/Open before the NIM-DTV stage
#   source.enable=0            full PLAT_VIU_ChangeInput path still missing
autoload = plat,display,panel,ir,audio,settings,service_db,image_decode,audio_curve,audio_mixer,audio_amp_profile,audio_amp,source,power,spi,tuner,epg,pvr,channels,i18n,cec,ticker,ui_clock,ui_anim,ui_engine,ui_vendor,ui_theme,ui_profile,ui_menu,ui_list,ui_navigation,lua

host.heartbeat = /tmp/openaurora.alive

settings.db = /conf/sqlite_db/settingsDB.db
settings.readonly = 0

plat.driver_wait = 1
plat.driver_marker = /tmp/ntkdriver_completed
plat.driver_timeout_ms = 60000
plat.drm_init = 1

display.fb = /dev/fb1
display.restore_snapshot = 0
display.set_region = 1
display.pan = 0
display.mirror = 0
display.profile = 1
display.cold_init = 1
# Force the vendor SetPar path even when the var already looks valid:
# BGRA format, transp alpha field, 32-byte stride, then region/pan. This is
# the cold OSD reinit path; takeover keeps it 0.
display.osd_reinit = 1

panel.start = 100
panel.channel = 0
panel.freq = 30000
panel.mode = 0
panel.curve = 1
panel.duty_max = 4095
panel.standby = 1
panel.power_on_start = 1

ir.blast = 1
ir.blast_helper = oa-ir-blast
ir.device =

tuner.hw_init = 1
tuner.backend = hal
tuner.hwprofile = /conf/mb230_hwprofile.bin
tuner.pcb_layout = 14
tuner.atv_tables = /vendor/com.nvt.idtv/aurora.elf

spi.enable = 1
spi.file = /conf/spi.bin
spi.device = /dev/ntkspi

audio_curve.aq = /conf/AQ.bin
audio_curve.profile = 0
audio_mixer.broker = ./oa-audio-broker
amp_profile.hwprofile = /conf/mb230_hwprofile.bin
audio.i2s_mclk = 1

# Board amp backend and CEC ownership are not accepted yet.
audio_amp.enable = 0
cec.enable = 0

# Full source switching is gated until the PLAT_VIU/V4L2/DRM/audio path is
# implemented and accepted.
source.enable = 0

ui.dir = /buffer/openaurora/ui
ui.download_dir = /buffer/downloaded_images
ui.fps = 0
ui.ok_file = /tmp/openaurora.ready
ui_menu.file = ./menus/sub_launcher.json
ui_theme.index = /vendor2/dynamic_ui/telefunken18_svg.txt
ui_theme.binary = /vendor2/dynamic_ui/telefunken18_svg.bin
ui_profile.swprofile = /conf/mb230_swprofile.bin

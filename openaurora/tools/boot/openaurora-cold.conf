# Cold-start candidate: no vendor Aurora. Run under oa-supervise, which owns
# watchdog disable/re-arm and execs /vendor/com.nvt.idtv/aurora.elf on failure.
autoload = plat,settings,image_decode,display,panel,ir,ui_engine,ui_vendor

host.heartbeat = /tmp/openaurora.alive

settings.db = /conf/sqlite_db/settingsDB.db
settings.readonly = 1

display.fb = /dev/fb1
display.restore_snapshot = 1

ui.dir = /buffer/openaurora/ui
ui.download_dir = /buffer/downloaded_images
ui.fps = 2
ui.ok_file = /tmp/openaurora.ready

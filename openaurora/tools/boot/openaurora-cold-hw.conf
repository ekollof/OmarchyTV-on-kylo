# Hardware-only cold-start ladder base — no display, UI, IR or settings.
#
# Derived only from the recovered vendor order in
# artifacts/reports/COLD-START-SEQUENCE-2026-11-10.md:
#   PLAT_DRV_INI_Init (plat)
#   DEV_INI_Init: panel -> amp/I2S-MCLK -> SPI init/open -> NIM-DTV
# The PCB/GPIO/source/NIM/amp-task/MTD stages without a documented equivalent
# are not listed as passing stages; source, audio-source, amp and CEC stay
# gated. Each stage adds one module so a failure is attributable.
#
# This profile is not installed and has no UI fallback. A real boot must still
# use the boot gate + external watchdog feeder and a pristine /conf recovery.
# host.ready_after_autoload writes the present receipt only when every
# autoloaded module loaded and start() returned 0. That proves sequence
# completion, not a hardware effect.

autoload = plat

host.heartbeat = /tmp/openaurora.alive
host.ready_after_autoload = 1
host.ready_file = /tmp/openaurora.ready

# PLAT_DRV_INI_Init: audio prelude, plat_common_init(DVIF), GPIO/IIC/VIN,
# NDAL_VideoExt_OpenDevice(0,10). The vendor waits for the kernel marker first.
plat.enable = 1
plat.driver_wait = 1
plat.driver_marker = /tmp/ntkdriver_completed
plat.driver_timeout_ms = 60000
plat.drm_init = 1
plat.vin = 1

# DEV_PANEL_Init/DEV_PANEL_PowerSequence: recovered PWM channel/curve/power
# values. The vendor Init timing block and GPIO-description copy are not
# reproduced by mod_panel; see the report.
panel.start = 100
panel.channel = 0
panel.freq = 30000
panel.mode = 0
panel.curve = 1
panel.duty_max = 4095
panel.standby = 0
panel.power_on_start = 0

# DEV_AMP_Init's first action is Hal_Audio_Ctrl(0x3a,{0x100}); the DEV_AMP_ID
# profile/factory task is not implemented. Enable only the MCLK request here.
audio.i2s_mclk = 0
audio.source_enable = 0

# DEV_SPI_Init/Open: mod_spi owns the file/device open; the vendor semaphore
# is not reproduced. The file path is preferred exactly as the vendor does.
spi.enable = 0
spi.file = /conf/spi.bin
spi.device = /dev/ntkspi

# DEV_NIM_DTV_Init: mod_tuner owns the recovered NIM-DTV task. DEV_NIM_Init's
# ATV/DTV factory objects are not recreated.
tuner.hw_init = 0
tuner.backend = hal
tuner.hwprofile = /conf/mb230_hwprofile.bin
tuner.pcb_layout = 14
tuner.atv_tables = /vendor/com.nvt.idtv/aurora.elf

# Stay closed until each stage has its own accepted cold run.
source.enable = 0
audio_amp.enable = 0
cec.enable = 0

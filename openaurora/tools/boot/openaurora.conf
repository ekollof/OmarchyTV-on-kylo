# /conf/openaurora.conf — what openaurora starts with on the set.
#
# The binary looks for this file by itself (core/main.c), so the boot hook only has to run
# /buffer/openaurora/openaurora. Everything below is a deliberate choice for this TV; anything not
# mentioned uses the module defaults.

# the module set: platform bring-up first, then the UI
# (requires[] in each module makes the host refuse the rest until plat has run)
autoload = plat,display,panel,ir,image_decode,ui_engine,ui_vendor

# The event loop writes liveness once a second; the supervisor runs separately.
host.heartbeat = /tmp/openaurora.alive

# ui_vendor
ui.dir     = /buffer/openaurora/ui
ui.focus   = 2
ui.fps     = 2
ui.ok_file = /tmp/openaurora.ready

# display: current-frame commits, without buffer rotation by default (see mod_display)
display.fb = /dev/fb1
display.restore_snapshot = 1

# Complete replacement composition — real platform, features, UI.
#
# plat.drm_init=0 keeps the vendor-initialized OSD layer; the real platform
# still runs the audio prelude, GPIO/IIC, VIN slots and STBC video open. This is
# takeover-mode until cold OSD allocation/enable is implemented. The known-good
# UI-only composition remains `replacement-bundle` (plat_stub).
autoload = plat,display,panel,ir,audio,source,power,tuner,settings,service_db,image_decode,epg,pvr,channels,i18n,audio_curve,audio_mixer,audio_amp_profile,audio_amp,cec,ticker,ui_clock,ui_anim,ui_engine,ui_vendor,ui_theme,ui_profile,ui_menu,ui_list,ui_navigation,lua

host.heartbeat = /tmp/openaurora.alive

settings.db = /conf/sqlite_db/settingsDB.db
settings.readonly = 0

plat.driver_wait = 1
plat.driver_marker = /tmp/ntkdriver_completed
plat.driver_timeout_ms = 60000
plat.drm_init = 0

display.fb = /dev/fb1
display.restore_snapshot = 1
display.set_region = 1
display.pan = 0
display.mirror = 0
display.profile = 1

panel.start = 100
panel.channel = 0
panel.freq = 30000
panel.mode = 0
panel.curve = 1
panel.duty_max = 4095
# Opt-in recovered standby power/LVDS sequence; not hardware-validated.
panel.standby = 0

ir.blast = 1
ir.blast_helper = oa-ir-blast
ir.device =

tuner.hw_init = 1
tuner.backend = hal
tuner.hwprofile = /conf/mb230_hwprofile.bin
tuner.pcb_layout = 14
tuner.atv_tables = /vendor/com.nvt.idtv/aurora.elf

audio_curve.aq = /conf/AQ.bin
audio_curve.profile = 0
audio_mixer.broker = ./oa-audio-broker
amp_profile.hwprofile = /conf/mb230_hwprofile.bin

audio_amp.enable = 0
cec.enable = 0

ui.dir = /buffer/openaurora/ui
ui.download_dir = /buffer/downloaded_images
ui.fps = 0
ui.ok_file = /tmp/openaurora.ready
ui_menu.file = ./menus/sub_launcher.json
ui_theme.index = /vendor2/dynamic_ui/telefunken18_svg.txt
ui_theme.binary = /vendor2/dynamic_ui/telefunken18_svg.bin
ui_profile.swprofile = /conf/mb230_swprofile.bin

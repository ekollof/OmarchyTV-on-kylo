# Replacement Aurora UI composition (takeover mode).
#
# plat_stub preserves the vendor-initialized OSD layer; the real plat DRM/KMS
# bring-up changes the visible plane and leaves fb1 UI black (HW-ACCEPT-2).
# Hardware services use the real-plat composition separately until cold OSD
# allocation/enable is recovered.
autoload = plat,display,panel,ir,settings,service_db,image_decode,ui_engine,ui_vendor,ticker,ui_clock,ui_anim

host.heartbeat = /tmp/openaurora.alive

settings.db = /conf/sqlite_db/settingsDB.db
settings.readonly = 1

display.fb = /dev/fb1
display.restore_snapshot = 1
display.set_region = 1
display.pan = 0
display.mirror = 0
display.profile = 1

ir.blast = 1
ir.blast_helper = oa-ir-blast
ir.device =

panel.start = 100
panel.channel = 0
panel.freq = 30000
panel.mode = 0
panel.curve = 1
panel.duty_max = 4095

ui.dir = /buffer/openaurora/ui
ui.download_dir = /buffer/downloaded_images
ui.fps = 0
ui.ok_file = /tmp/openaurora.ready
ui_menu.file = ./menus/sub_launcher.json

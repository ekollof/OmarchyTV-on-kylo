# Native replacement composition — real platform, OmarchyTV shell.
#
# Same hardware/feature stack as the full replacement, but the visible UI is
# mod_ui_omarchy over ui.engine. The vendor portal stack (ui_vendor/ui_theme/
# ui_profile/ui_menu/ui_list/ui_navigation) is intentionally not autoloaded;
# those modules remain in the bundle for diagnostics or an explicit reload.
#
# plat.drm_init=0 keeps the vendor-initialized OSD layer; the real platform
# still runs the audio prelude, GPIO/IIC, VIN slots and STBC video open. This is
# takeover-mode until cold OSD allocation/enable is implemented.
autoload = plat,display,panel,ir,audio,source,power,tuner,settings,service_db,image_decode,epg,pvr,channels,i18n,audio_curve,audio_mixer,app_launch,audio_amp_profile,audio_amp,cec,ticker,ui_clock,ui_anim,lua,ui_engine,ui_omarchy

host.heartbeat = /tmp/openaurora.alive

settings.db = /conf/sqlite_db/settingsDB.db
settings.readonly = 0

plat.driver_wait = 1
plat.driver_marker = /tmp/ntkdriver_completed
plat.driver_timeout_ms = 60000
plat.drm_init = 0

display.fb = /dev/fb1
display.restore_snapshot = 1
display.set_region = 1
display.pan = 0
display.mirror = 0
display.profile = 1
# Repair a registered-but-unconfigured fb1 on cold boot (no effect when var is valid).
display.cold_init = 1

panel.start = 100
panel.channel = 0
panel.freq = 30000
panel.mode = 0
panel.curve = 1
panel.duty_max = 4095
# Opt-in recovered standby power/LVDS sequence; not hardware-validated.
panel.standby = 0
# Cold-boot panel power-on (DEV_PANEL_PowerSequence). Keep 0 for a takeover:
# stock already owns the panel. Set 1 only when booting without stock.
panel.power_on_start = 0

ir.blast = 1
ir.blast_helper = oa-ir-blast
ir.device =

tuner.hw_init = 1
tuner.backend = hal
tuner.hwprofile = /conf/mb230_hwprofile.bin
tuner.pcb_layout = 14
tuner.atv_tables = /vendor/com.nvt.idtv/aurora.elf

audio_curve.aq = /conf/AQ.bin
audio_curve.profile = 0
audio_mixer.broker = ./oa-audio-broker
amp_profile.hwprofile = /conf/mb230_hwprofile.bin

audio_amp.enable = 0
cec.enable = 0

ui.dir = ./ui
ui.download_dir = /buffer/downloaded_images
ui.fps = 0
ui.ok_file = /tmp/openaurora.ready
ui.omarchy.lua = 0
# Editable Lua widget panes. The sandbox exposes /proc and oa.fetch; the
# script may publish up to 3 panes (weather, stats, RSS, ...).
ui.lua.script = ./lua/omarchy.lua
ui.lua.data = /buffer/openaurora/lua-data
# OAI1 wallpaper name under ui.dir; missing file falls back to the gradient.
# Import one with tools/ui/mk-wallpaper.py (no artwork is redistributed here).
ui.omarchy.wallpaper = wallpaper

# Launcher action consumer. Disabled by default: the nvt.app.debug.ini profile
# disables Netflix/Amazon/YouTube, and the display-name->NAM map is per-profile.
# Enable only after choosing a profile and validating oa-app-launch on the TV.
app_launch.enable = 0
app_launch.helper = ./oa-app-launch
app_launch.map = ./oa_apps.map
app_launch.reap_ms = 100
